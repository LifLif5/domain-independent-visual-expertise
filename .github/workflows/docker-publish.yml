name: Build and publish the analysis container image

# OPTIONAL helper, not required for the submission.
#
# Builds environment/Dockerfile on GitHub's free runners (so no local Docker is
# needed) and pushes the image to GitHub Container Registry.  Reviewers can then
# reproduce everything with a single command:
#
#   docker run --rm -v "$PWD/code":/code -v "$PWD/data":/data \
#              -v "$PWD/results":/results -w /code \
#              ghcr.io/<owner>/<repo>:latest bash run
#
# Trigger it manually (Actions -> this workflow -> Run workflow) and check the
# log once; the first build takes ~20-30 min because R and lme4 are compiled.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image name, but the repository name is not.
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: environment
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
