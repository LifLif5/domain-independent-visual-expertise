# Conda environment specification for the Domain-Independent Visual Expertise capsule.
#
# Validated on macOS (osx-64) and written so that it also resolves on linux-64,
# which is what Code Ocean uses.  Every dependency here can be installed through
# the Code Ocean Environment Editor ("Conda" package manager, channel:
# conda-forge); the pip-only packages are in requirements.txt.
# See ../README.md for setup and troubleshooting.
name: eyetracking

channels:
  - conda-forge
  # Never fall back to the Anaconda `defaults` channel (not licensed for this
  # machine, and not available on Code Ocean).  The Dockerfile installs this
  # file into the image's `base` environment via
  #   mamba env update --name base --file environment.yml
  # where `--name` overrides the `name:` key above.
  - nodefaults

dependencies:
  # ---- Python interpreter -------------------------------------------------
  # All notebooks were authored with a Python 3.10 kernel.
  - python=3.10

  # ---- Core scientific / analysis stack -----------------------------------
  - numpy>=1.26,<3
  - pandas=2.2          # groupby.apply behaviour the notebooks rely on
  - scipy>=1.11
  - statsmodels>=0.14   # code/statistic_checks/GLMs.py (smf.ols, mixedlm)
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13
  - shapely>=2.0        # convex hull / centroid helpers in mot_helpers.py
  - pyyaml>=6           # mot_config.yaml
  - polars>=1.29,<2     # pymer4 0.9.x accepts polars DataFrames only

  # ---- Jupyter tooling (notebook execution / IDE) -------------------------
  - jupyterlab>=3
  - notebook>=6
  - nbconvert>=7
  - nbclient>=0.7
  - nbformat>=5
  - ipykernel>=6
  - matplotlib-inline  # `run` uses MPLBACKEND=module://matplotlib_inline...

  # ---- R + rpy2 -----------------------------------------------------------
  # pymer4 is a thin Python wrapper around R; it needs a working R and rpy2.
  - r-base=4.4
  - rpy2>=3.5.11,<4

  # ---- R packages required by pymer4 0.9.2 -------------------------------
  - r-lme4              # lmer / glmer
  - r-lmertest          # p-values for lmer (Satterthwaite df)
  - r-broom             # tidy()
  - r-broom.mixed       # tidy() for mixed models (random effect variances)
  - r-emmeans           # model.emmeans()
  - r-boot              # bootMer / conf_method="boot"
  - r-tibble
  - r-optimx            # optimx-based optimisers used by parameters/lme4
  # easystats bundle (model_parameters(), r2(), report(), ...)
  - r-insight
  - r-parameters
  - r-performance
  - r-report

  # ---- pip ---------------------------------------------------------------
  - pip
